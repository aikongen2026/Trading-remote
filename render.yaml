# V4.4: paid 0.5c-512mb + persistent disk are required for true unattended 24/7 trading.
services:
  - type: web
    name: tradingbot-remote
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: python cloud_app.py
    healthCheckPath: /healthz
    envVars:
      - key: ALPACA_KEY
        sync: false
      - key: ALPACA_SECRET
        sync: false
      - key: ALPACA_PAPER
        value: "true"
      - key: TRADINGBOT_PAPER_ONLY
        value: "true"
      - key: ALPACA_DATA_FEED
        value: auto
      - key: ALPACA_DATA_FEED_AUTO
        value: "true"
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_BANDWIDTH_CAP_GB
        value: "5"
      - key: RENDER_USAGE_WARN_PCT
        value: "60"
      - key: RENDER_USAGE_SAVE_PCT
        value: "75"
      - key: RENDER_USAGE_STRONG_PCT
        value: "85"
      - key: RENDER_USAGE_HARD_PCT
        value: "95"
      - key: RENDER_USAGE_CHECK_SEC
        value: "900"
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DASHBOARD_SECRET_KEY
        generateValue: true
      - key: PUBLIC_MODE
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: CLOUD_SAFE_START
        value: "true"
      - key: ENGINE_AUTORESTART
        value: "true"
      - key: TRADINGBOT_STATE_DIR
        value: /var/data/tradingbot
    disk:
      name: tradingbot-state
      mountPath: /var/data
      sizeGB: 1
