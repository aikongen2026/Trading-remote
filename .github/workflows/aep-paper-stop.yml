name: Explicit AEP PAPER stop safeguard
on:
  pull_request:
    paths:
      - 'paper_aep_protection.py'
      - 'trading_bot.py'
      - 'control_server.py'
      - 'tests/test_aep_paper_stop.py'
      - 'tests/test_aep_origin_proxy.py'
      - '.github/workflows/aep-paper-stop.yml'
jobs:
  safe-human-confirmation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Verify PAPER-only stop, consent and replay safety
        run: |
          python -m unittest discover -s tests -p 'test_aep_paper_stop.py' -v
          python -m unittest discover -s tests -p 'test_aep_origin_proxy.py' -v
