name: Strategy selector persistence
on:
  pull_request:
    paths:
      - 'control_server.py'
      - 'trading_bot.py'
      - 'tests/test_strategy_selection.py'
      - '.github/workflows/strategy-selection.yml'
jobs:
  verify-persisted-strategy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing requirements
        run: pip install -r requirements.txt
      - name: Check strategy selection and profile behavior
        run: python -m unittest discover -s tests -p 'test_strategy_selection.py' -v
